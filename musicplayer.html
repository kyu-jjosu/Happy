<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Music Player</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  color: #171515;
}

.player {
  width: 100%;
  max-width: 560px;
  margin: auto;
  background: linear-gradient(50deg, #B4E7FF, #F9E6B2);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 28px;
  padding: 14px;
  box-shadow: 0 0 15px rgba(180,231,255,.15);
}

.cover {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 22px;
  overflow: hidden;
  background: #aaa;
  position: relative;
}

/* 실제 유튜브 플레이어는 숨기거나 투명하게 처리하여 소리와 오디오 권한을 확보합니다 */
#yt-player {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  pointer-events: none; /* 클릭 방해 금지 */
}

.cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.info {
  padding: 18px 8px 8px;
  text-align: center;
}

.title {
  font-size: 21px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  font-size: 15px;
  color: #777;
  margin-top: 6px;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #777;
  font-size: 13px;
  margin: 18px 4px 8px;
}

input[type=range] {
  flex: 1;
  height: 6px;
  border-radius: 9px;
  background: #aaa;
  accent-color: #555;
  cursor: pointer;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 35px;
  padding: 12px 0 4px;
}

button {
  border: 0;
  background: transparent;
  color: #151313;
  cursor: pointer;
  transition: transform 0.1s ease;
}

button:active {
  transform: scale(0.92);
}

button svg {
  width: 30px;
  height: 30px;
  fill: currentColor;
}

button.main svg {
  width: 48px;
  height: 48px;
}

.status {
  font-size: 11px;
  color: #817976;
  text-align: center;
  padding-top: 8px;
}
</style>
</head>

<body>

<div class="player">
  <div class="cover">
    <!-- 유튜브 플레이어 iframe (노션 권한 샌드박스 완벽 대응 및 오디오 허용) -->
    <iframe id="yt-player" 
      src="https://www.youtube.com/embed/videoseries?list=PLAy4QPNVwM40&enablejsapi=1&playsinline=1" 
      allow="autoplay; encrypted-media; picture-in-picture">
    </iframe>
  </div>

  <div class="info">
    <div class="title" id="title">YouTube Playlist</div>
    <div class="artist">Notion Music Widget</div>
  </div>

  <div class="progress-row">
    <span id="elapsed">0:00</span>
    <input id="seek" type="range" min="0" max="100" value="0">
    <span id="remaining">-0:00</span>
  </div>

  <div class="controls">
    <button onclick="previousVideo()">
      <svg viewBox="0 0 24 24">
        <path d="M6 5h2v14H6zM20 5v14L9 12z"/>
      </svg>
    </button>

    <button class="main" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M7 4v16l13-8z"/>
      </svg>
    </button>

    <button onclick="nextVideo()">
      <svg viewBox="0 0 24 24">
        <path d="M16 5h2v14h-2zM4 5v14l11-7z"/>
      </svg>
    </button>
  </div>

  <div class="status" id="status">PLAYER READY</div>
</div>

<script>
// 유튜브 IFrame 플레이어 API 연동을 위한 안전한 메시징 제어
const iframe = document.getElementById('yt-player');
let isPlaying = false;

function postMessageToPlayer(func, args = []) {
  if (iframe && iframe.contentWindow) {
    iframe.contentWindow.postMessage(JSON.stringify({
      event: 'command',
      func: func,
      args: args
    }), '*');
  }
}

// 재생 / 일시정지 토글
function togglePlay() {
  const playIcon = document.getElementById('playIcon');
  if (!isPlaying) {
    postMessageToPlayer('playVideo');
    playIcon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
    document.getElementById('status').textContent = "NOW PLAYING";
    isPlaying = true;
  } else {
    postMessageToPlayer('pauseVideo');
    playIcon.innerHTML = '<path d="M7 4v16l13-8z"/>';
    document.getElementById('status').textContent = "PAUSED";
    isPlaying = false;
  }
}

// 다음 곡
function nextVideo() {
  postMessageToPlayer('nextVideo');
  document.getElementById('status').textContent = "NEXT TRACK";
  isPlaying = true;
  document.getElementById('playIcon').innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
}

// 이전 곡
function previousVideo() {
  postMessageToPlayer('previousVideo');
  document.getElementById('status').textContent = "PREVIOUS TRACK";
  isPlaying = true;
  document.getElementById('playIcon').innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
}
</script>

</body>
</html>
